services:
  healerdb-postgres:
    image: postgres:16-alpine
    container_name: healerdb_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${TARGET_DB_NAME:-healerdb}
      POSTGRES_USER: ${TARGET_DB_USER:-healerdb_user}
      POSTGRES_PASSWORD: ${TARGET_DB_PASSWORD:-healerdb_pass}
    ports:
      - "${TARGET_DB_PORT:-5433}:5432"
    volumes:
      - healerdb-data:/var/lib/postgresql/data
      - ./backend/scripts/seed_dirty_data.sql:/docker-entrypoint-initdb.d/seed.sql
    networks:
      - healerdb-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TARGET_DB_USER:-healerdb_user} -d ${TARGET_DB_NAME:-healerdb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  healerdb-redis:
    image: redis:7.2-alpine
    container_name: healerdb_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - healerdb-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru

  healerdb-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: healerdb_backend
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      TARGET_DB_HOST: healerdb-postgres
      TARGET_DB_PORT: 5432
      TARGET_DB_NAME: ${TARGET_DB_NAME:-healerdb}
      TARGET_DB_USER: ${TARGET_DB_USER:-healerdb_user}
      TARGET_DB_PASSWORD: ${TARGET_DB_PASSWORD:-healerdb_pass}
      REDIS_HOST: healerdb-redis
      REDIS_PORT: 6379
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    depends_on:
      healerdb-postgres:
        condition: service_healthy
      healerdb-redis:
        condition: service_healthy
    networks:
      - healerdb-net

  healerdb-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: healerdb_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://localhost:8001
    depends_on:
      - healerdb-backend
    networks:
      - healerdb-net

volumes:
  healerdb-data:

networks:
  healerdb-net:
    driver: bridge
