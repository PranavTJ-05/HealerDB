services:
  healerdb-postgres:
    image: postgres:16-alpine
    container_name: healerdb_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${TARGET_DB_NAME:-healerdb}
      POSTGRES_USER: ${TARGET_DB_USER:-healerdb_user}
      POSTGRES_PASSWORD: ${TARGET_DB_PASSWORD:-healerdb_pass}
    ports:
      - "${TARGET_DB_PORT:-5433}:5432"
    volumes:
      - healerdb-data:/var/lib/postgresql/data
      - ./backend/scripts/seed_dirty_data.sql:/docker-entrypoint-initdb.d/seed.sql
    networks:
      - healerdb-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TARGET_DB_USER:-healerdb_user} -d ${TARGET_DB_NAME:-healerdb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  healerdb-redis:
    image: redis:7.2-alpine
    container_name: healerdb_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - healerdb-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru

volumes:
  healerdb-data:

networks:
  healerdb-net:
    driver: bridge
